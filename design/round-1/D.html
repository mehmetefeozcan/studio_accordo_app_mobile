<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@100,200,300,400,500,600,700,800,900,300i,400i&display=swap">
<style>
  :root{
    --ground:#0B1410;
    --cream:#F4F1E6;
    --sage:#6E8B75;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--ground)}
  body{
    font-family:'Switzer',system-ui,sans-serif;
    color:var(--cream);
    min-height:100vh;
    padding:52px 46px 80px 46px;
    text-align:right;
  }
  .pluck{margin-bottom:54px}
  .attack{
    display:block;
    font-weight:900;
    font-size:76px;
    line-height:.9;
    letter-spacing:-.05em;
  }
  .d1{display:block;font-weight:400;font-size:30px;line-height:1.1;letter-spacing:.02em;color:var(--cream)}
  .d2{display:block;font-weight:300;font-size:22px;line-height:1.2;letter-spacing:.1em;color:var(--sage)}
  .d3{display:block;font-weight:200;font-size:16px;line-height:1.35;letter-spacing:.22em;color:var(--sage)}
  .d4{display:block;font-weight:100;font-size:12px;line-height:1.6;letter-spacing:.4em;color:var(--sage)}
  .num{font-variant-numeric:tabular-nums}
  .sig{
    display:block;
    font-weight:300;
    font-style:italic;
    font-size:15px;
    letter-spacing:.06em;
    color:var(--sage);
    margin-bottom:62px;
  }
  .quiet{
    display:block;
    font-weight:100;
    font-size:11px;
    letter-spacing:.48em;
    color:var(--sage);
    line-height:2.2;
    margin-top:30px;
  }
</style>
</head>
<body>
  <span class="sig">Studio Accordo</span>

  <div class="pluck">
    <span class="attack">Akort</span>
    <span class="d1 num">−4 sent</span>
    <span class="d2">Akortta</span>
    <span class="d3">Pes&nbsp;&nbsp;Tiz</span>
    <span class="d4">Teller&nbsp;&nbsp;E A D G B E</span>
  </div>

  <div class="pluck">
    <span class="attack">Metronom</span>
    <span class="d1 num">hedef 96 BPM</span>
    <span class="d2 num">Ölçü 12–28</span>
    <span class="d3">Ödevin</span>
    <span class="d4 num">doğruluk %92</span>
  </div>

  <div class="pluck">
    <span class="attack">Bu Hafta</span>
    <span class="d1 num">3 sa 40 dk</span>
    <span class="d2 num">hedef 5 sa</span>
    <span class="d3 num">Geçen haftaya göre +35 dk</span>
    <span class="d4">İlerleme</span>
  </div>

  <div class="pluck">
    <span class="attack">440 Hz</span>
    <span class="d1">Referans frekansı</span>
    <span class="d2">Kromatik</span>
    <span class="d3">Nota tara</span>
    <span class="d4">Kütüphane</span>
  </div>

  <span class="quiet">Günaydın</span>
  <span class="quiet">Kaldığın yer&nbsp;&nbsp;Dün</span>
  <span class="quiet">Notalar çözümleniyor</span>
</body>
</html>
