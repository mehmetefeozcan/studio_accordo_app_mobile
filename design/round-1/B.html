<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=khand@300,400,500,600,700&display=swap">
<style>
  :root{
    --ground:#100F0D;
    --bone:#EDE7DB;
    --taupe:#7E7769;
    --amber:#D8A520;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--ground)}
  body{
    font-family:'Khand',sans-serif;
    color:var(--bone);
    padding:40px 0 64px 34px;
    min-height:100vh;
    text-transform:uppercase;
  }
  .grp{display:block}
  .g2{margin-bottom:11px}
  .g3{margin-bottom:46px}
  .head{
    font-weight:700;
    font-size:92px;
    line-height:.78;
    letter-spacing:-.012em;
    color:var(--amber);
  }
  .beat{
    font-weight:700;
    font-size:92px;
    line-height:.78;
    letter-spacing:-.012em;
  }
  .off{
    font-weight:400;
    font-size:92px;
    line-height:.78;
    letter-spacing:-.004em;
    color:var(--taupe);
  }
  .sub{
    font-weight:500;
    font-size:27px;
    line-height:1.08;
    letter-spacing:.07em;
  }
  .subdim{
    font-weight:300;
    font-size:27px;
    line-height:1.08;
    letter-spacing:.07em;
    color:var(--taupe);
  }
  .subhit{
    font-weight:600;
    font-size:27px;
    line-height:1.08;
    letter-spacing:.07em;
    color:var(--amber);
  }
  .tiny{
    font-weight:500;
    font-size:14px;
    letter-spacing:.3em;
    color:var(--taupe);
    line-height:1.5;
  }
  .num{font-variant-numeric:tabular-nums}
  .mark{
    font-weight:600;
    font-size:14px;
    letter-spacing:.52em;
    color:var(--bone);
    margin-bottom:58px;
  }
  .tail{margin-top:54px}
</style>
</head>
<body>
  <div class="mark">Studio Accordo</div>

  <div class="g2">
    <div class="head">Akort</div>
    <div class="beat">Metronom</div>
  </div>

  <div class="g2">
    <div class="off">Nota tara</div>
    <div class="off">Kütüphane</div>
  </div>

  <div class="g3">
    <div class="beat">İlerleme</div>
    <div class="off">Ödevin</div>
    <div class="off">Teller</div>
  </div>

  <div class="g2">
    <div class="subhit">Bu Hafta</div>
    <div class="sub num">3 sa 40 dk</div>
  </div>

  <div class="g2">
    <div class="subdim num">hedef 5 sa</div>
    <div class="subdim num">Geçen haftaya göre +35 dk</div>
  </div>

  <div class="g3">
    <div class="subhit">Akortta</div>
    <div class="sub num">−4 sent</div>
    <div class="subdim">Pes&nbsp;&nbsp;Tiz</div>
  </div>

  <div class="g2">
    <div class="subhit num">440 Hz</div>
    <div class="subdim">Referans frekansı</div>
  </div>

  <div class="g2">
    <div class="sub num">Ölçü 12–28</div>
    <div class="subdim num">hedef 96 BPM</div>
  </div>

  <div class="g3">
    <div class="subhit">Kromatik</div>
    <div class="sub">E A D G B E</div>
    <div class="subdim num">doğruluk %92</div>
  </div>

  <div class="tiny tail">
    Günaydın<br>
    Kaldığın yer&nbsp;&nbsp;Dün<br>
    Notalar çözümleniyor
  </div>
</body>
</html>
