<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=technor@300,400,500,600,700,900&f[]=supreme@300,400,500,700&display=swap">
<style>
  :root{
    --ground:#F1F0EC;
    --ink:#14171A;
    --flat:#1B5A6B;
    --sharp:#A03A1C;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--ground);color:var(--ink)}
  body{
    font-family:'Supreme',system-ui,sans-serif;
    font-feature-settings:"tnum" 1;
    padding:56px 40px 48px;
    min-height:100vh;
  }
  .axis{
    display:grid;
    grid-template-columns:1fr max-content 1fr;
    column-gap:30px;
    align-items:baseline;
  }
  .l{text-align:right;color:var(--flat)}
  .c{text-align:center}
  .r{text-align:left;color:var(--sharp)}

  .wordmark{
    grid-column:1 / -1;
    text-align:center;
    font-family:'Technor',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--ink);
    margin-bottom:76px;
  }
  .row{display:contents}
  .readout{
    font-family:'Technor',sans-serif;
    font-weight:700;
    font-size:150px;
    line-height:.84;
    letter-spacing:-.045em;
    font-variant-numeric:tabular-nums;
  }
  .side{
    font-family:'Technor',sans-serif;
    font-weight:500;
    font-size:30px;
    line-height:1.1;
    letter-spacing:.06em;
    text-transform:uppercase;
  }
  .state{
    grid-column:1 / -1;
    text-align:center;
    font-family:'Technor',sans-serif;
    font-weight:400;
    font-size:19px;
    letter-spacing:.3em;
    text-transform:uppercase;
    margin-top:22px;
  }
  .cents{
    grid-column:1 / -1;
    text-align:center;
    font-size:14px;
    font-weight:500;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--flat);
    margin-top:10px;
  }
  .gap{grid-column:1 / -1;height:92px}
  .pair{
    display:grid;
    grid-template-columns:1fr max-content 1fr;
    column-gap:30px;
    row-gap:15px;
    align-items:baseline;
    font-size:15px;
    line-height:1.3;
  }
  .pair .k{text-align:right;color:var(--flat);font-weight:500;letter-spacing:.015em}
  .pair .m{text-align:center;font-family:'Technor',sans-serif;font-weight:600;font-size:21px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .pair .v{text-align:left;color:var(--sharp);font-weight:400;letter-spacing:.015em}
  .strings{
    grid-column:1 / -1;
    text-align:center;
    font-family:'Technor',sans-serif;
    font-weight:300;
    font-size:46px;
    letter-spacing:.34em;
    margin-top:66px;
  }
  .foot{
    display:grid;
    grid-template-columns:1fr max-content 1fr;
    column-gap:30px;
    margin-top:66px;
    font-size:11px;
    letter-spacing:.24em;
    text-transform:uppercase;
    font-weight:500;
  }
  .foot .l{color:var(--flat)}
  .foot .r{color:var(--sharp)}
  .foot .c{color:var(--ink)}
</style>
</head>
<body>
  <div class="axis">
    <div class="wordmark">Studio Accordo</div>

    <div class="l side">Pes</div>
    <div class="c readout">−4</div>
    <div class="r side">Tiz</div>

    <div class="state">Akortta</div>
    <div class="cents">−4 sent</div>

    <div class="gap"></div>
  </div>

  <div class="pair">
    <div class="k">Referans frekansı</div>
    <div class="m">440 Hz</div>
    <div class="v">Kromatik</div>

    <div class="k">Bu Hafta</div>
    <div class="m">3 sa 40 dk</div>
    <div class="v">hedef 5 sa</div>

    <div class="k">Geçen haftaya göre +35 dk</div>
    <div class="m">doğruluk %92</div>
    <div class="v">Ölçü 12–28</div>

    <div class="k">Ödevin</div>
    <div class="m">hedef 96 BPM</div>
    <div class="v">Kaldığın yer · Dün</div>
  </div>

  <div class="axis">
    <div class="strings">E A D G B E</div>
  </div>

  <div class="foot">
    <div class="l">Akort&nbsp;&nbsp;Metronom</div>
    <div class="c">Teller</div>
    <div class="r">Nota tara&nbsp;&nbsp;Kütüphane&nbsp;&nbsp;İlerleme</div>
  </div>

  <div class="axis">
    <div class="cents" style="margin-top:34px">Günaydın&nbsp;&nbsp;·&nbsp;&nbsp;Notalar çözümleniyor</div>
  </div>
</body>
</html>
