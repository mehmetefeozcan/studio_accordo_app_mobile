<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=zodiak@100,300,400,700,800,900&f[]=zodiak@400i&display=swap">
<style>
  :root{
    --ground:#EDE6D5;
    --umber:#241D15;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--ground)}
  body{
    font-family:'Zodiak',Georgia,serif;
    color:var(--umber);
    padding:80px 44px 120px 60px;
    min-height:100vh;
  }
  .stack{display:block;max-width:none}
  .s{display:block;font-variant-numeric:tabular-nums}

  .f01{font-size:124px;line-height:.92;font-weight:100;letter-spacing:-.028em;margin-bottom:38px}
  .f02{font-size:104px;line-height:.93;font-weight:100;letter-spacing:-.026em;margin-bottom:32px}
  .f03{font-size:87px;line-height:.94;font-weight:300;letter-spacing:-.022em;margin-bottom:27px}
  .f04{font-size:73px;line-height:.96;font-weight:300;letter-spacing:-.019em;margin-bottom:23px}
  .f05{font-size:62px;line-height:.98;font-weight:400;letter-spacing:-.016em;margin-bottom:19px}
  .f06{font-size:52px;line-height:1.0;font-weight:400;letter-spacing:-.013em;margin-bottom:16px}
  .f07{font-size:44px;line-height:1.02;font-weight:400;letter-spacing:-.01em;margin-bottom:13px}
  .f08{font-size:37px;line-height:1.05;font-weight:700;letter-spacing:-.008em;margin-bottom:11px}
  .f09{font-size:31px;line-height:1.08;font-weight:700;letter-spacing:-.005em;margin-bottom:9px}
  .f10{font-size:26px;line-height:1.12;font-weight:700;letter-spacing:-.002em;margin-bottom:8px}
  .f11{font-size:22px;line-height:1.16;font-weight:800;letter-spacing:.002em;margin-bottom:6px}
  .f12{font-size:18px;line-height:1.2;font-weight:800;letter-spacing:.006em;margin-bottom:5px}
  .f13{font-size:15px;line-height:1.26;font-weight:900;letter-spacing:.012em;margin-bottom:4px}
  .f14{font-size:13px;line-height:1.32;font-weight:900;letter-spacing:.02em;margin-bottom:4px}
  .f15{font-size:11px;line-height:1.4;font-weight:900;letter-spacing:.03em;margin-bottom:3px}
  .f16{font-size:9px;line-height:1.5;font-weight:900;letter-spacing:.05em}
  .it{font-style:italic;font-weight:400}
</style>
</head>
<body>
  <div class="stack">
    <span class="s f01 it">Studio Accordo</span>
    <span class="s f02">Akort</span>
    <span class="s f03">Metronom</span>
    <span class="s f04">Nota tara</span>
    <span class="s f05">Kütüphane</span>
    <span class="s f06">İlerleme</span>
    <span class="s f07">Teller — E A D G B E</span>
    <span class="s f08">Referans frekansı 440 Hz</span>
    <span class="s f09">Kromatik</span>
    <span class="s f10">Akortta — Pes, Tiz, −4 sent</span>
    <span class="s f11">Bu Hafta 3 sa 40 dk, hedef 5 sa</span>
    <span class="s f12">Geçen haftaya göre +35 dk</span>
    <span class="s f13">Ödevin — Ölçü 12–28, hedef 96 BPM</span>
    <span class="s f14">doğruluk %92</span>
    <span class="s f15">Kaldığın yer — Dün</span>
    <span class="s f16">Günaydın — Notalar çözümleniyor</span>
  </div>
</body>
</html>
